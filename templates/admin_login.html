<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login Administrativo</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo svg {
      height: 32px;
    }
    h1 {
      font-size: 1.25rem;
      color: #111827;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #E91E8C;
      box-shadow: 0 0 0 3px rgba(233,30,140,0.1);
    }
    .btn-login {
      width: 100%;
      background: #E91E8C;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-login:hover {
      background: #C2185B;
    }
    .error {
      background: #fef2f2;
      color: #b91c1c;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      border: 1px solid #f87171;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 120 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 4L4 18l6 14" stroke="#E91E8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="26" font-family="Inter,sans-serif" font-weight="800" font-size="22" fill="#111827">livelo admin</text>
      </svg>
    </div>
    
    {% if error %}
    <div class="error">
      {{ error }}
    </div>
    {% endif %}
    
    <p style="text-align: center; color: #374151; margin-bottom: 24px; font-size: 0.95rem;">
      O acesso ao painel é restrito. <br>Autentique-se com sua conta do Telegram.
    </p>

    <div style="display: flex; justify-content: center; margin-top: 10px;">
      <script async src="https://telegram.org/js/telegram-widget.js?22" 
              data-telegram-login="{{ bot_username }}" 
              data-size="large" 
              data-auth-url="/admin/tg_callback" 
              data-request-access="write"></script>
    </div>
    
    <p style="text-align: center; font-size: 0.75rem; color: #9ca3af; margin-top: 24px;">
      Nota: O bot precisa ter seu domínio configurado via @BotFather (/setdomain)
    </p>
  </div>
</body>
</html>
