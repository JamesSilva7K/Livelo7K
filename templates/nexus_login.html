<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito | Nexus Gate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        :root {
            --bg-dark: #0A0A0A;
            --bg-panel: rgba(20, 20, 20, 0.9);
            --border-glow: rgba(229, 20, 122, 0.5);
            --pink-accent: #E5147A;
            --text-main: #FFFFFF;
            --text-muted: #A0A0A0;
            --red: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; background-image: radial-gradient(circle at 15% 50%, rgba(229, 20, 122, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(229, 20, 122, 0.1), transparent 25%); }
        .login-container { background: var(--bg-panel); padding: 3rem; border-radius: 1rem; border: 1px solid var(--border-glow); box-shadow: 0 0 40px rgba(229, 20, 122, 0.2); width: 100%; max-width: 400px; text-align: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
        .logo { width: 80px; height: 80px; background: linear-gradient(135deg, #111, #222); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; border: 2px solid var(--pink-accent); box-shadow: 0 0 20px var(--border-glow); font-size: 2rem; }
        h2 { font-weight: 800; font-size: 1.5rem; margin-bottom: 0.5rem; letter-spacing: 1px; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }
        .input-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid #333; color: white; padding: 1rem; border-radius: 0.5rem; font-size: 1.2rem; text-align: center; letter-spacing: 4px; outline: none; transition: all 0.3s; }
        input:focus { border-color: var(--pink-accent); box-shadow: 0 0 15px var(--border-glow); }
        button { width: 100%; background: var(--pink-accent); color: white; border: none; padding: 1rem; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; box-shadow: 0 0 20px rgba(229, 20, 122, 0.4); }
        button:hover { background: #ff1a8c; box-shadow: 0 0 30px rgba(229, 20, 122, 0.6); transform: translateY(-2px); }
        #error-msg { color: var(--red); font-size: 0.9rem; margin-top: 1rem; min-height: 20px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🔐</div>
        <h2>NEXUS GATE</h2>
        <p class="subtitle">Acesso Restrito - Insira seu código</p>
        <div class="input-group">
            <label for="pin">PIN de Acesso</label>
            <input type="text" id="pin" maxlength="6" placeholder="000000" autocomplete="off">
        </div>
        <button onclick="login()">Autenticar</button>
        <div id="error-msg"></div>
    </div>
    <script>
        const portId = "{{ port_id }}";
        async function login() {
            const pin = document.getElementById('pin').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.querySelector('button');
            if(!pin || pin.length < 6) { errorMsg.innerText = "Digite o PIN completo (6 dígitos)."; return; }
            errorMsg.innerText = ""; btn.innerText = "Verificando..."; btn.disabled = true;
            try {
                const res = await fetch('/api/supreme/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin, port_id: portId })
                });
                const data = await res.json();
                if(data.ok) {
                    btn.innerText = "Acesso Permitido!";
                    btn.style.background = "#10B981";
                    setTimeout(() => { window.location.href = data.redirect || "/admin"; }, 500);
                } else {
                    errorMsg.innerText = data.error || "Acesso Negado.";
                    btn.innerText = "Autenticar"; btn.disabled = false;
                }
            } catch(e) {
                errorMsg.innerText = "Erro de conexão."; btn.innerText = "Autenticar"; btn.disabled = false;
            }
        }
        document.getElementById('pin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
